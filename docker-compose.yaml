services:
  backend:
    # ! best practice leave it like that 
    # ! notice <project-name>_<service-name>_<instance-number> : this is the default name of the container
    image: ${DOCKER_USERNAME}/kubeshop-backend:latest
    ports:
      - "3000:3000"  
    # depends_on:
    #   - mongodb
    environment:
      MONGO_URI: ${MONGO_URI}
      JWT_SECRET: ${JWT_SECRET}
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET}
    networks:
      - kubeshop-network
    deploy:
      resources:
        limits:
          memory: "1G"
          cpus: "1.0"
        reservations:
          memory: "512M"
          cpus: "0.5"

  frontend:
    image: ${DOCKER_USERNAME}/kubeshop-frontend:latest
    ports:
      - "5173:80"  
    depends_on:
      - backend
    environment:
         - VITE_BASE_URL=http://localhost:3000/api
    networks:
      - kubeshop-network
    deploy:
      resources:
        limits:
          memory: "512M"
          cpus: "1.0"
        reservations:
          memory: "256M"
          cpus: "0.5"

