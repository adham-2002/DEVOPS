apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        image: adhamelganzoury/kubeshop-backend:latest
        ports:
        - containerPort: 3000
        env:
        - name: MONGO_URI
          value: mongodb+srv://adham54732:l3sfSf25TBFEGwmr@aaie.qzizwal.mongodb.net/Ecommerce?retryWrites=true&w=majority&appName=AAIE
        - name: JWT_SECRET
          value: adhamsomethingsecret
        resources:
          limits:
            memory: 1G
            cpu: "1"
          requests:
            memory: 512M
            cpu: "0.5"
---
apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  selector:
    app: backend
  ports:
    - protocol: TCP
      port: 3000
      targetPort: 3000