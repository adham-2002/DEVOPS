    deploy:
      resources:
        limits:
          memory: "512M"
          cpus: "1.0"
        reservations:
          memory: "256M"
          cpus: "0.5"

  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf  # Correct path
    depends_on:
      - frontend
      - backend
    networks:
      - kubeshop-network

networks:
  kubeshop-network:
  
