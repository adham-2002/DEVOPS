name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  DOCKER_REGISTRY: docker.io
  REPO_NAME: E-Commerce-Platform

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          path: 'e-commerce-platform'
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Images
        working-directory: ./e-commerce-platform/infrastructure/docker
        run: |
          docker compose -f docker-compose.yaml build --no-cache
          docker compose -f docker-compose.yaml push

  deploy:
    needs: build
    runs-on: ubuntu-latest
    env:
      AWS_HOSTS: ${{ secrets.AWS_HOSTS }}  # Comma-separated IPs
      SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          path: 'e-commerce-platform'
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Ansible
        run: |
          sudo apt-get update
          sudo apt-get install -y ansible git

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY_B64 }}" | base64 --decode > ~/.ssh/kubeshop-key.pem
          chmod 600 ~/.ssh/kubeshop-key.pem
          
          # Add all hosts to known_hosts
          for ip in $(echo "${{ secrets.AWS_HOSTS }}" | tr ',' ' '); do
              ssh-keyscan -H $ip >> ~/.ssh/known_hosts
          done

      - name: Generate dynamic inventory
        working-directory: ./e-commerce-platform/infrastructure/ansible/inventory
        run: |
          # Create hosts.ini with dynamic IPs
          echo "[production]" > hosts.ini
          for ip in $(echo "${{ secrets.AWS_HOSTS }}" | tr ',' ' '); do
              echo "$ip ansible_user=ubuntu" >> hosts.ini
          done
          echo -e "\n[production:vars]" >> hosts.ini
          echo "ansible_ssh_private_key_file=~/.ssh/kubeshop-key.pem" >> hosts.ini
          echo "ansible_python_interpreter=/usr/bin/python3" >> hosts.ini

      - name: Run Ansible playbook
        working-directory: ./e-commerce-platform/infrastructure/ansible
        run: |
          ansible-playbook -i inventory/hosts.ini playbooks/deploy.yml \
            --extra-vars "DOCKER_USERNAME=${{ secrets.DOCKER_USERNAME }} \
            DOCKER_PASSWORD=${{ secrets.DOCKER_PASSWORD }} \
            GITHUB_PAT=${{ secrets.GITHUB_PAT }}" -vvv
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"