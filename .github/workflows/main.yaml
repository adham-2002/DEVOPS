name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  DOCKER_REGISTRY: docker.io
  REPO_NAME: e-commerce-platform

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v3
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Images with Docker Compose
        working-directory: ./infrastructure/docker
        run: |
          # Enable Buildx with the use of local cache
          docker buildx create --use
          
          # Build and push images with Docker Compose and caching
          docker-compose -f docker-compose.yml build --build-arg BUILDKIT_INLINE_CACHE=1
          docker-compose -f docker-compose.yml push
          
          # Optionally, you can also save the cache back to a registry
          docker buildx build \
            --file Dockerfile \
            --tag $DOCKER_REGISTRY/$REPO_NAME:latest \
            --cache-to type=local,dest=/tmp/.buildx-cache \
            --cache-from type=local,src=/tmp/.buildx-cache \
            --push .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    env:
      AWS_HOSTS: ${{ secrets.AWS_HOSTS }}
      SSH_USERNAME: ${{ secrets.SSH_USERNAME }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Ansible
        run: |
          sudo apt-get update
          sudo apt-get install -y ansible git

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY_B64 }}" | base64 --decode > ~/.ssh/kubeshop-key.pem
          chmod 600 ~/.ssh/kubeshop-key.pem
          for ip in $(echo "${{ secrets.AWS_HOSTS }}" | tr ',' ' '); do
              ssh-keyscan -H $ip >> ~/.ssh/known_hosts
          done

      - name: Generate dynamic inventory
        working-directory: ./infrastructure/ansible/inventory
        run: |
          echo "[production]" > hosts.ini
          for ip in $(echo "${{ secrets.AWS_HOSTS }}" | tr ',' ' '); do
              echo "$ip ansible_user=ubuntu" >> hosts.ini
          done
          echo -e "\n[production:vars]" >> hosts.ini
          echo "ansible_ssh_private_key_file=~/.ssh/kubeshop-key.pem" >> hosts.ini
          echo "ansible_python_interpreter=/usr/bin/python3" >> hosts.ini

      - name: Run Ansible playbook
        working-directory: ./infrastructure/ansible
        run: |
          ansible-playbook -i inventory/hosts.ini playbooks/deploy.yml \
            --extra-vars "DOCKER_USERNAME=${{ secrets.DOCKER_USERNAME }} \
            DOCKER_PASSWORD=${{ secrets.DOCKER_PASSWORD }} \
            GITHUB_PAT=${{ secrets.GITHUB_PAT }}" -vvv
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
