---
- name: Deploy E-Commerce Platform
  hosts: all
  become: yes
  vars:
    docker_username: "{{ DOCKER_USERNAME }}"
    docker_password: "{{ DOCKER_PASSWORD }}"
    github_pat: "{{ GITHUB_PAT }}"
    repo_url: "https://{{ github_pat }}@github.com/adham-2002/E-Commerce-Platform.git"
    app_dir: "/home/{{ ansible_user }}/ecommerce-app"

  tasks:
    # Install prerequisites
    - name: Install required system packages
      apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - software-properties-common
          - git
        update_cache: yes
        state: present

    # Install Docker
    - name: Add Docker GPG key
      apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        state: present

    - name: Add Docker repository
      apt_repository:
        repo: deb [arch=amd64] https://download.docker.com/linux/ubuntu jammy stable
        state: present

    - name: Install Docker
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
        state: present
        update_cache: yes

    - name: Install Docker Compose
      get_url:
        url: https://github.com/docker/compose/releases/download/v2.23.0/docker-compose-linux-x86_64
        dest: /usr/local/bin/docker-compose
        mode: '0755'

    # Configure Docker
    - name: Start and enable Docker service
      service:
        name: docker
        state: started
        enabled: yes

    - name: Add user to docker group
      user:
        name: "{{ ansible_user }}"
        groups: docker
        append: yes

    # Clone repository
    - name: Ensure app directory exists
      file:
        path: "{{ app_dir }}"
        state: directory
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0755'

    - name: Clone private repository
      git:
        repo: "https://{{ github_pat }}@github.com/adham-2002/E-Commerce-Platform.git"
        dest: "{{ app_dir }}"
        version: main
        force: yes
      register: clone_result
      retries: 3
      delay: 10
      until: clone_result is succeeded
      environment:
        GIT_TERMINAL_PROMPT: "0"
