---
- name: Deploy E-Commerce Platform
  hosts: all
  become: yes
  vars:
    docker_username: "{{ DOCKER_USERNAME }}"
    docker_password: "{{ DOCKER_PASSWORD }}"
    app_dir: "/home/{{ ansible_user }}/ecommerce-app"

  tasks:
    # Install prerequisites
    - name: Install required system packages
      apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - software-properties-common
          - git
        update_cache: yes
        state: present

    # Install Docker
    - name: Add Docker GPG key
      apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        state: present

    - name: Add Docker repository
      apt_repository:
        repo: deb [arch=amd64] https://download.docker.com/linux/ubuntu jammy stable
        state: present

    - name: Install Docker
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
        state: present
        update_cache: yes

    - name: Install Docker Compose
      get_url:
        url: https://github.com/docker/compose/releases/download/v2.23.0/docker-compose-linux-x86_64
        dest: /usr/local/bin/docker-compose
        mode: '0755'

    # Configure Docker
    - name: Start and enable Docker service
      service:
        name: docker
        state: started
        enabled: yes

    - name: Add user to docker group
      user:
        name: "{{ ansible_user }}"
        groups: docker
        append: yes

    # Ensure app directory exists
    - name: Ensure app directory exists
      file:
        path: "{{ app_dir }}"
        state: directory
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0755'

    # Copy project files from GitHub Actions runner to remote host
    - name: Copy project files to remote host
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../"  # path to the root of the repo relative to the playbook
        dest: "{{ app_dir }}"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0755'

    # Run Docker Compose
    - name: Run Docker Compose
      ansible.builtin.shell: |
        docker compose down
        docker compose up -d
      args:
        chdir: "{{ app_dir }}"
