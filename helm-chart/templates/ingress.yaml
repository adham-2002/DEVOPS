apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kubeshop-ingress
  namespace: {{ .Values.namespace }}
  annotations:

spec:
  ingressClassName: nginx
  rules:
  - host: {{ .Values.ingress.host }}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend
            port:
              number: {{ .Values.frontend.servicePort}}  # Frontend Service Port
      
      - path: /api 
        pathType: ImplementationSpecific 
        backend:
          service:
            name: backend
            port:
              number: {{ .Values.backend.servicePort}}  # Backend Service Port