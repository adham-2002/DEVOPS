{{- if .Values.redis.enabled}}

apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: {{ .Values.namespace}}
  labels:
    app: redis
spec:
  selector:
    app: redis
  ports:
  - name: redis
    port: {{ .Values.redis.service.port }}
    targetPort: {{ .Values.redis.service.port }}
    targetPort: 6379
  type: ClusterIP
{{- end}}
